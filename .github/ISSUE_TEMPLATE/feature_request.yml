name: Feature request
description: Suggest an improvement to archive conversion or the user experience.
body:
  - type: markdown
    attributes:
      value: |
        Check existing issues before suggesting a feature. Describe your task using invented examples, without sharing private conversations or exports.
        The desktop preview synchronizes a separately connected Claude account into owned Obsidian notes. The archive importer remains an offline fallback. Describe which workflow your request changes.
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
      description: Explain the user task and what makes it difficult today.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired behavior
      description: Describe the result you would expect, including a small invented example if useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
      description: Optional. Mention a workaround, related issue, or effect on privacy, source preservation, compatibility, or archive size.
