name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_release.py
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            obsidian-plugin/package-lock.json
            desktop-extension/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: obsidian-plugin
      - run: npm test
        working-directory: obsidian-plugin
      - run: npm run build
        working-directory: obsidian-plugin
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: desktop-extension
      - run: npm run verify
        working-directory: desktop-extension
      - run: python3 tools/build_release.py --desktop
